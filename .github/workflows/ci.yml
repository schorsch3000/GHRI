name: ci
on: [push, pull_request]

jobs:
  all:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y make $(grep -vE '^(#|$)' apt-packages.txt)
      - name: Lint, format check, tests, config check
        run: make ci
